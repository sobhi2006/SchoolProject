version: '3.8'

services:
  clean-arch:
    container_name: cleanapp
    image: "sop/clean"
    ports: 
      - "8000:80"
    depends_on:
      - sqlserver

  sqlserver:
    container_name: SchoolProject-sql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=sa123456
    ports:
      - "1433:1433"

 